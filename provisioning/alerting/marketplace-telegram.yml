apiVersion: 1

contactPoints:
  - orgId: 1
    name: Telegram — критические оповещения
    receivers:
      - uid: telegram-critical
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_CRITICAL_CHAT_ID
          message: |
            {{ range .Alerts -}}
            {{ if eq .Status "firing" }}🔴 СРАБОТАЛО{{ else }}✅ ВОССТАНОВЛЕНО{{ end }}: {{ .Labels.alertname }}
            {{ if eq .Labels.marketplace "wb" }}Маркетплейс: Wildberries{{ else if eq .Labels.marketplace "ozon" }}Маркетплейс: Ozon{{ end }}
            Товар: {{ .Labels.product_id }}
            {{ with .Annotations.summary }}{{ . }}
            {{ end }}{{ with .Annotations.description }}{{ . }}
            {{ end }}{{ if eq .Labels.severity "critical" }}Важность: критическая{{ else if eq .Labels.severity "warning" }}Важность: предупреждение{{ end }}
            {{ end }}
        disableResolveMessage: false
  - orgId: 1
    name: Telegram — предупреждения
    receivers:
      - uid: telegram-warning
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: $TELEGRAM_WARNING_CHAT_ID
          message: |
            {{ range .Alerts -}}
            {{ if eq .Status "firing" }}🟡 СРАБОТАЛО{{ else }}✅ ВОССТАНОВЛЕНО{{ end }}: {{ .Labels.alertname }}
            {{ if eq .Labels.marketplace "wb" }}Маркетплейс: Wildberries{{ else if eq .Labels.marketplace "ozon" }}Маркетплейс: Ozon{{ end }}
            Товар: {{ .Labels.product_id }}
            {{ with .Annotations.summary }}{{ . }}
            {{ end }}{{ with .Annotations.description }}{{ . }}
            {{ end }}{{ if eq .Labels.severity "critical" }}Важность: критическая{{ else if eq .Labels.severity "warning" }}Важность: предупреждение{{ end }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Telegram — предупреждения
    group_by:
      - alertname
      - marketplace
      - product_id
    routes:
      - receiver: Telegram — критические оповещения
        object_matchers:
          - [severity, '=', critical]
      - receiver: Telegram — предупреждения
        object_matchers:
          - [severity, '=', warning]
