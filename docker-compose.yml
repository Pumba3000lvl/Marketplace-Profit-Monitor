services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_DEFAULT_APP_MODE: development
      GF_LOG_LEVEL: debug
      GF_LOG_FILTERS: plugin.*=debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: pumba3000lvl-profitmonitor-datasource
    volumes:
      - ./dist:/var/lib/grafana/plugins/pumba3000lvl-profitmonitor-datasource:ro
      - grafana-data:/var/lib/grafana

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  grafana-data:
  redis-data:
